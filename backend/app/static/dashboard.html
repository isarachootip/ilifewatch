<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iLife Watch · Staff Dashboard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2329;--muted:#5f6b76;--line:#e2e6ea;--accent:#0e7c86;--crit:#b3261e;--warn:#c25e00;--ok:#188038;--soft:#eef6f7}
@media (prefers-color-scheme:dark){:root{--bg:#111416;--card:#1b2024;--ink:#e6eaed;--muted:#9aa5ae;--line:#2c3439;--accent:#4fb3bc;--crit:#f2867f;--warn:#f0a35c;--ok:#6fcf8f;--soft:#1f2a2d}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI","Noto Sans Thai","Noto Sans SC","Noto Sans Arabic",sans-serif}
header{display:flex;gap:12px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);flex-wrap:wrap}
header h1{font-size:17px;margin:0;flex:1}main{max-width:1120px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}input,textarea,select{font:inherit;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);width:100%}
#langSelect{width:auto;padding:5px 10px;font-size:14px}
nav{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}nav button.on{background:var(--soft);border-color:var(--accent)}
table{width:100%;border-collapse:collapse}th,td{text-align:start;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:500;font-size:13px}
a{color:var(--accent)}tr.click{cursor:pointer}tr.click:hover{background:var(--soft)}.muted{color:var(--muted)}.crit{color:var(--crit);font-weight:600}.warn{color:var(--warn);font-weight:600}.ok{color:var(--ok);font-weight:600}
.badge{display:inline-block;min-width:22px;text-align:center;padding:0 6px;border-radius:10px;background:var(--crit);color:#fff;font-size:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px}.stat .v{font-size:24px;font-weight:700}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hidden{display:none}svg text{fill:var(--muted);font-size:11px}
.scroll{overflow-x:auto}#login{max-width:360px;margin:60px auto}
</style>
</head>
<body>
<header>
  <h1 id="brandTitle">iLife Watch · แดชบอร์ดเจ้าหน้าที่</h1>
  <span id="who" class="muted"></span>
  <select id="langSelect" aria-label="Language">
    <option value="th">🇹🇭 ไทย</option>
    <option value="en">🇬🇧 English</option>
    <option value="zh">🇨🇳 中文</option>
    <option value="ar">🇸🇦 العربية</option>
    <option value="de">🇩🇪 Deutsch</option>
  </select>
  <button id="logout" class="hidden">ออกจากระบบ</button>
</header>
<main>
  <section id="login" class="card">
    <h2 id="loginHeading" style="margin-top:0">เข้าสู่ระบบ</h2>
    <p><input id="email" placeholder="อีเมล" autocomplete="username"></p>
    <p><input id="pw" type="password" placeholder="รหัสผ่าน" autocomplete="current-password"></p>
    <p><button class="primary" id="go">เข้าสู่ระบบ</button> <span id="lerr" class="crit"></span></p>
  </section>

  <section id="app" class="hidden">
    <nav id="tabs"></nav>
    <div id="view"></div>
  </section>
</main>
<script src="/static/i18n.js"></script>
<script src="/static/charts.js"></script>
<script src="/static/dashboard.js"></script>
</body>
</html>
